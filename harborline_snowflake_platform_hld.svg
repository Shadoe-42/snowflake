<svg viewBox="0 0 1300 900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="900" fill="#ffffff"/>

  <text x="650" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1a2330">Harborline Logistics — Snowflake Platform Architecture</text>
  <text x="650" y="58" text-anchor="middle" font-size="13" fill="#5b6472">Phase 1: general architecture foundation — CSP-neutral core, cloud-specific mechanics only at the ingestion boundary</text>

  <!-- External ingestion sources (CSP-neutral) -->
  <rect x="60" y="90" width="520" height="90" rx="10" fill="#f2f5f8" stroke="#5b6472" stroke-width="1.5"/>
  <text x="320" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2330">CSP object storage (S3 or GCS)</text>
  <text x="320" y="135" text-anchor="middle" font-size="11" fill="#3a4250">TMS shipment-event files (continuous) · inventory batch extracts (nightly)</text>
  <text x="320" y="153" text-anchor="middle" font-size="10.5" fill="#8a8f98">Storage integration + auto-ingest trigger mechanics: docs/integrations/csp-crosswalk.md</text>

  <rect x="720" y="90" width="520" height="90" rx="10" fill="#f2f5f8" stroke="#5b6472" stroke-width="1.5"/>
  <text x="980" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2330">Okta / Entra ID</text>
  <text x="980" y="135" text-anchor="middle" font-size="11" fill="#3a4250">SSO + MFA — federates directly into Snowflake, cloud-agnostic</text>
  <text x="980" y="153" text-anchor="middle" font-size="10.5" fill="#8a8f98">docs/architecture/02-security-governance-rbac.md</text>

  <line x1="320" y1="180" x2="320" y2="215" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="980" y1="180" x2="980" y2="215" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Snowflake account core -->
  <rect x="60" y="215" width="1180" height="470" rx="12" fill="#eef7fb" stroke="#1a8cc4" stroke-width="2"/>
  <text x="650" y="243" text-anchor="middle" font-size="16" font-weight="700" fill="#0d4a63">Snowflake Account — HARBORLINE database</text>

  <!-- Ingestion methods -->
  <rect x="85" y="260" width="330" height="70" rx="8" fill="#ffffff" stroke="#1a8cc4"/>
  <text x="250" y="284" text-anchor="middle" font-size="12" font-weight="600" fill="#0d4a63">Snowpipe (auto-ingest)</text>
  <text x="250" y="302" text-anchor="middle" font-size="10.5" fill="#3a4250">continuous TMS shipment events</text>
  <text x="250" y="318" text-anchor="middle" font-size="10.5" fill="#3a4250">terraform/aws/, terraform/gcp/</text>

  <rect x="85" y="345" width="330" height="60" rx="8" fill="#ffffff" stroke="#1a8cc4"/>
  <text x="250" y="368" text-anchor="middle" font-size="12" font-weight="600" fill="#0d4a63">COPY INTO (scheduled)</text>
  <text x="250" y="386" text-anchor="middle" font-size="10.5" fill="#3a4250">nightly inventory batch, via WH_ELT</text>

  <line x1="415" y1="295" x2="460" y2="295" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="415" y1="375" x2="460" y2="375" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- RAW schema -->
  <rect x="465" y="260" width="180" height="145" rx="8" fill="#ffffff" stroke="#1a8cc4" stroke-width="1.5"/>
  <text x="555" y="284" text-anchor="middle" font-size="13" font-weight="700" fill="#0d4a63">RAW schema</text>
  <text x="555" y="304" text-anchor="middle" font-size="10.5" fill="#3a4250">Landing zone</text>
  <text x="555" y="320" text-anchor="middle" font-size="10.5" fill="#3a4250">docs/architecture/</text>
  <text x="555" y="334" text-anchor="middle" font-size="10.5" fill="#3a4250">04-ingestion-patterns.md</text>
  <text x="555" y="358" text-anchor="middle" font-size="10" fill="#8a8f98">e.g. SHIPMENTS,</text>
  <text x="555" y="372" text-anchor="middle" font-size="10" fill="#8a8f98">SHIPMENT_STATUS_CODES</text>
  <text x="555" y="392" text-anchor="middle" font-size="10" fill="#8a8f98">(illustrative — 03-data-modeling.md)</text>

  <line x1="645" y1="332" x2="695" y2="332" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="670" y="320" text-anchor="middle" font-size="9.5" fill="#5b6472">Dynamic</text>
  <text x="670" y="349" text-anchor="middle" font-size="9.5" fill="#5b6472">Tables</text>

  <!-- ANALYTICS schema -->
  <rect x="700" y="260" width="180" height="145" rx="8" fill="#ffffff" stroke="#1a8cc4" stroke-width="1.5"/>
  <text x="790" y="284" text-anchor="middle" font-size="13" font-weight="700" fill="#0d4a63">ANALYTICS schema</text>
  <text x="790" y="304" text-anchor="middle" font-size="10.5" fill="#3a4250">Transformed, query-ready</text>
  <text x="790" y="324" text-anchor="middle" font-size="10.5" fill="#8a8f98">Default: Dynamic Tables</text>
  <text x="790" y="340" text-anchor="middle" font-size="10.5" fill="#8a8f98">(single SELECT, target lag</text>
  <text x="790" y="356" text-anchor="middle" font-size="10.5" fill="#8a8f98">&gt;= 60s)</text>
  <text x="790" y="378" text-anchor="middle" font-size="10.5" fill="#8a8f98">Fallback: Streams &amp; Tasks</text>
  <text x="790" y="393" text-anchor="middle" font-size="10.5" fill="#8a8f98">(procedural / sub-minute)</text>

  <!-- Warehouses row -->
  <rect x="85" y="425" width="1130" height="140" rx="10" fill="#eef8f0" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="150" y="450" font-size="12.5" font-weight="700" fill="#1f5c3a">Virtual warehouses (workload isolation)</text>

  <rect x="105" y="465" width="330" height="80" rx="8" fill="#ffffff" stroke="#2e8b57"/>
  <text x="270" y="488" text-anchor="middle" font-size="12" font-weight="600" fill="#1f5c3a">HARBORLINE_WH_ELT</text>
  <text x="270" y="506" text-anchor="middle" font-size="10.5" fill="#3a4250">Single-cluster · auto-suspend 60s</text>
  <text x="270" y="522" text-anchor="middle" font-size="10.5" fill="#3a4250">Nightly loads, RAW→ANALYTICS transforms</text>
  <text x="270" y="538" text-anchor="middle" font-size="10" fill="#8a8f98">FR_ELT usage grant</text>

  <rect x="460" y="465" width="330" height="80" rx="8" fill="#ffffff" stroke="#2e8b57"/>
  <text x="625" y="488" text-anchor="middle" font-size="12" font-weight="600" fill="#1f5c3a">HARBORLINE_WH_BI</text>
  <text x="625" y="506" text-anchor="middle" font-size="10.5" fill="#3a4250">Single-cluster today · first candidate</text>
  <text x="625" y="522" text-anchor="middle" font-size="10.5" fill="#3a4250">to flip multi-cluster under contention</text>
  <text x="625" y="538" text-anchor="middle" font-size="10" fill="#8a8f98">FR_ANALYST usage grant</text>

  <rect x="815" y="465" width="330" height="80" rx="8" fill="#ffffff" stroke="#2e8b57"/>
  <text x="980" y="488" text-anchor="middle" font-size="12" font-weight="600" fill="#1f5c3a">HARBORLINE_WH_DATA_SCIENCE</text>
  <text x="980" y="506" text-anchor="middle" font-size="10.5" fill="#3a4250">Single-cluster · auto-suspend 60s</text>
  <text x="980" y="522" text-anchor="middle" font-size="10.5" fill="#3a4250">Route-optimization notebooks</text>
  <text x="980" y="538" text-anchor="middle" font-size="10" fill="#8a8f98">Not yet granted to a Functional Role</text>

  <text x="1195" y="450" text-anchor="end" font-size="10" fill="#8a8f98">All three share one account-level</text>
  <text x="1195" y="463" text-anchor="end" font-size="10" fill="#8a8f98">resource monitor (05-cost-governance.md)</text>

  <!-- RBAC panel -->
  <rect x="85" y="585" width="1130" height="85" rx="10" fill="#f4f0fb" stroke="#7a5fb0" stroke-width="1.5"/>
  <text x="150" y="608" font-size="12.5" font-weight="700" fill="#3d2c5c">RBAC — Access Roles → Functional Roles (on-ramp: no Service Role layer yet)</text>
  <text x="150" y="630" font-size="11" fill="#3d2c5c">AR_RAW_SELECT · AR_RAW_WRITE · AR_ANALYTICS_SELECT</text>
  <text x="150" y="648" font-size="11" fill="#3d2c5c">(atomic, one schema + one privilege each — terraform/core/rbac.tf)</text>
  <line x1="640" y1="620" x2="700" y2="620" stroke="#7a5fb0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="760" y="614" font-size="11" font-weight="600" fill="#3d2c5c">FR_ELT</text>
  <text x="760" y="630" font-size="10" fill="#5c4a80">writes RAW, reads both</text>
  <text x="900" y="614" font-size="11" font-weight="600" fill="#3d2c5c">FR_ANALYST</text>
  <text x="900" y="630" font-size="10" fill="#5c4a80">reads ANALYTICS only</text>
  <text x="150" y="662" font-size="10" fill="#8a8f98">Privileges go to roles, never to users — the one rule held from day one regardless of layer count.</text>

  <!-- Consumers -->
  <rect x="150" y="815" width="280" height="55" rx="8" fill="#f2f5f8" stroke="#5b6472"/>
  <text x="290" y="840" text-anchor="middle" font-size="12" fill="#1a2330">Dispatch / ops dashboards</text>
  <text x="290" y="857" text-anchor="middle" font-size="10" fill="#5b6472">via WH_BI + FR_ANALYST</text>

  <rect x="510" y="815" width="280" height="55" rx="8" fill="#f2f5f8" stroke="#5b6472"/>
  <text x="650" y="840" text-anchor="middle" font-size="12" fill="#1a2330">ELT pipeline (automation)</text>
  <text x="650" y="857" text-anchor="middle" font-size="10" fill="#5b6472">via WH_ELT + FR_ELT</text>

  <rect x="870" y="815" width="280" height="55" rx="8" fill="#f2f5f8" stroke="#5b6472"/>
  <text x="1010" y="840" text-anchor="middle" font-size="12" fill="#1a2330">Route-optimization notebooks</text>
  <text x="1010" y="857" text-anchor="middle" font-size="10" fill="#5b6472">via WH_DATA_SCIENCE</text>

  <line x1="290" y1="685" x2="290" y2="815" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="685" x2="650" y2="815" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1010" y1="685" x2="1010" y2="815" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <text x="60" y="890" font-size="10.5" fill="#8a8f98">Out of scope for this diagram: private connectivity (documented, not Terraformed — see terraform/README.md), Marketplace, and Secure Data Sharing / Clean Rooms (Phase 3).</text>
</svg>
